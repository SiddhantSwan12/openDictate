[package]
name = "opendictate-core"
version = "0.1.0"
edition = "2021"
description = "Platform-independent dictation text processing, ported from BetterWispr (Apache-2.0)"
license = "Apache-2.0"

[dependencies]
regex = "1"
fancy-regex = "0.14"
whatlang = "0.16"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
url = "2"
